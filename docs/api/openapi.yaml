      summary: Read nonclinical background worker and outbox status
      description: Requires network_admin; reports worker heartbeat, queued and dead-letter outbox counts and pending Cardano
        batch preparation. No private keys, proof files, clinical records or hospital credentials are returned. Offline preparation
        does not imply a Preprod transaction.
