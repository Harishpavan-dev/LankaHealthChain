        '409':
          description: State or integrity conflict
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '429':
          description: Rate limited
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '503':
          description: Dependency not ready
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
