      - bearerAuth: []
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Keycloak OIDC access token, audience lhc-api; role & patient/doctor scope verified by backend
  schemas:
    ApiError:
      type: object
      properties:
        statusCode:
          type: integer
          minimum: 400
          maximum: 599
        code:
          type: string
        message:
          oneOf:
          - type: string
          - type: array
            items:
              type: string
        requestId:
          type: string
      additionalProperties: false
      required:
      - statusCode
      - code
      - message
      - requestId
    Health:
      type: object
      properties:
        status:
          type: string
          const: ok
        service:
          type: string
        version:
          type: string
        clinicalUse:
          type: boolean
      additionalProperties: false
      required:
      - status
      - service
      - version
      - clinicalUse
    Readiness:
      type: object
      properties:
        status:
          type: string
          const: ready
        service:
          type: string
        version:
          type: string
        clinicalUse:
          type: boolean
      additionalProperties: false
      required:
      - status
      - service
      - version
      - clinicalUse
    Hospital:
      type: object
      properties:
        id:
          type: string
          format: uuid
        code:
          type: string
        name:
          type: string
      additionalProperties: false
      required:
      - id
      - code
      - name
    DoctorSummary:
      type: object
      properties:
        displayName:
          type: string
        hospital:
          type: object
          properties:
            name:
              type: string
          additionalProperties: false
          required:
          - name
      additionalProperties: false
      required:
      - displayName
      - hospital
    AccessRequestCreate:
      type: object
      properties:
        patientId:
          type: string
          format: uuid
        purpose:
          type: string
          enum:
          - treatment
          - follow-up
        requestedTypes:
          type: array
          minItems: 1
          maxItems: 5
          uniqueItems: true
          items:
            type: string
            enum:
            - Observation
            - DiagnosticReport
            - MedicationRequest
            - AllergyIntolerance
            - Condition
        requestedDurationMinutes:
          type: integer
          minimum: 1
          maximum: 1440
      additionalProperties: false
      required:
      - patientId
      - purpose
      - requestedTypes
      - requestedDurationMinutes
    AccessRequest:
      type: object
      properties:
        id:
          type: string
          format: uuid
        patientId:
          type: string
          format: uuid
        doctorId:
          type: string
          format: uuid
        purpose:
          type: string
        status:
          type: string
          enum:
          - PENDING
          - APPROVED
          - REJECTED
          - REVOKED
        requestedTypes:
          type: array
          items:
            type: string
        requestedDurationMinutes:
          type: integer
        decisionDeadlineAt:
          type: string
          format: date-time
        createdAt:
          type: string
          format: date-time
        doctor:
          $ref: '#/components/schemas/DoctorSummary'
      additionalProperties: false
      required:
      - id
      - patientId
      - doctorId
      - purpose
      - status
      - requestedTypes
      - requestedDurationMinutes
      - decisionDeadlineAt
      - createdAt
    Consent:
      type: object
      properties:
        id:
          type: string
          format: uuid
        requestId:
          type: string
          format: uuid
        patientId:
          type: string
          format: uuid
        doctorId:
          type: string
          format: uuid
        hospitalId:
          type: string
          format: uuid
        purpose:
          type: string
        allowedTypes:
          type: array
          items:
            type: string
        status:
          type: string
          enum:
          - ACTIVE
          - REVOKED
        expiresAt:
          type: string
          format: date-time
        revokedAt:
          anyOf:
          - type: string
            format: date-time
          - type: 'null'
        verificationMode:
          type: string
          const: LOCAL_DEMO_NOT_MIDNIGHT
      additionalProperties: false
      required:
      - id
      - requestId
      - status
      - expiresAt
    Decision:
      type: object
      properties:
        status:
          type: string
          enum:
          - REJECTED
          - REVOKED
        verificationMode:
          type: string
      additionalProperties: false
      required:
      - status
    RecordIndex:
