openapi: 3.1.0
info:
  title: LankaHealthChain Demo API
  version: 0.12.0
  description: Synthetic-data-only interoperability prototype. Local consent is NOT Midnight ZK verification and local integrity
    is NOT Cardano confirmation. Never connect real patient information. API error responses include X-Request-ID. Optional
    doctor-scoped request idempotency. Pagination added for verified doctor requests and patient consents. v0.9.0 adds scoped
    hospital operator management, de-identified security audit views and restricted synthetic research aggregates. NOT production
    clinical authorization. v0.10.0 adds dedicated PostgreSQL-backed offline anchor worker monitoring, without blockchain
    signing or PHI exposure. v0.11.0 moves deployment coordinates to validated environment config and randomizes synthetic
    Keycloak demo credentials; no new clinical capability. v0.12.0 reorganizes repository folders into frontend/
    and backend/ and adds English installation documentation; the API contract is unchanged.
servers:
- url: http://localhost:3000/api/v1
  description: Loopback-only development demo
tags:
- name: Health
  description: Health operations
- name: Directory
  description: Directory operations
- name: Access
  description: Access operations
- name: Patient
  description: Patient operations
- name: Consent
  description: Consent operations
- name: Record exchange
  description: Record exchange operations
- name: Records
  description: Records operations
- name: Verification
  description: Verification operations
- name: Audit
  description: Audit operations
- name: Administration
  description: Administration operations
- name: Hospital administration
  description: Hospital-scoped non-clinical institutional governance
- name: Security audit
  description: De-identified read-only audit views
- name: Research
  description: Approved synthetic aggregate research only
security:
- bearerAuth: []
paths:
