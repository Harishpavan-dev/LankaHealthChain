  /access-requests:
    post:
      tags:
      - Access
      operationId: createAccessRequest
      summary: Create scoped access request
      description: Patient approval deadline is 24h. This does not grant consent. Optional Idempotency-Key deduplicates retries
        across API replicas; reuse with different body returns 409.
