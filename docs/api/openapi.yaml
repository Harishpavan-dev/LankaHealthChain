        '503':
          description: Dependency not ready
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
      security:
      - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AccessRequestCreate'
            example:
              patientId: b1111111-1111-4111-8111-111111111111
              purpose: treatment
              requestedTypes:
              - Observation
              - MedicationRequest
              requestedDurationMinutes: 60
      parameters:
      - name: Idempotency-Key
        in: header
        required: false
        schema:
          type: string
          minLength: 8
          maxLength: 128
          pattern: ^[A-Za-z0-9_-]+$
        description: Opaque doctor-scoped retry key; same key + changed request returns 409. Concurrent retries share the
          same request ID.
