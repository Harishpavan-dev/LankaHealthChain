      type: object
      properties:
        id:
          type: string
          format: uuid
        authSubject:
          type: string
        active:
          type: boolean
        hospital:
          type: object
          properties:
            code:
              type: string
            name:
              type: string
    OperatorList:
      type: array
      items:
        $ref: '#/components/schemas/OperatorRecord'
    ResearchGrantRecord:
      type: object
      properties:
        id:
          type: string
          format: uuid
        authSubject:
          type: string
        projectName:
          type: string
        active:
          type: boolean
        expiresAt:
          type: string
          format: date-time
    ResearchGrantList:
      type: array
      items:
        $ref: '#/components/schemas/ResearchGrantRecord'
    OperatorEnrollmentResult:
      type: object
      properties:
        id:
          type: string
          format: uuid
        hospitalCode:
          type: string
        active:
          const: true
        note:
          type: string
    StatusResult:
      type: object
      properties:
        id:
          type: string
          format: uuid
        active:
          type: boolean
    ResearchGrantEnrollmentResult:
      type: object
      properties:
        id:
          type: string
          format: uuid
        projectName:
          type: string
        expiresAt:
          type: string
          format: date-time
        mode:
          const: SYNTHETIC_DEMO
    WorkerStatus:
      type: object
      additionalProperties: false
      required:
      - worker
      - status
      - queued
      - deadLettered
      - prepared
      - totalPrepared
      - onchainSubmission
      - clinicalDataExposed
      properties:
        worker:
          type: string
          const: cardano-anchor-preparer
        status:
          type: string
          enum:
          - offline
          - stale
          - degraded
          - healthy
        queued:
          type: integer
          minimum: 0
        deadLettered:
          type: integer
          minimum: 0
        prepared:
          type: integer
          minimum: 0
        lastSeenAt:
          type:
          - string
          - 'null'
          format: date-time
        lastSuccessAt:
          type:
          - string
          - 'null'
          format: date-time
        lastErrorCode:
          type:
          - string
          - 'null'
        totalPrepared:
          type: integer
          minimum: 0
        onchainSubmission:
          type: string
          const: MANUAL_OPERATOR_REQUIRED
        clinicalDataExposed:
          type: boolean
          const: false
