name: Source checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.22.3'
      - uses: pnpm/action-setup@v4
        with:
          version: 10.18.0
      - run: pnpm install --no-frozen-lockfile
      - run: pnpm test
      - run: pnpm test:protocol
      - run: pnpm check:syntax
      - run: pnpm --filter @lhc/shared build
      - name: Generate Prisma clients and build
        env:
          DATABASE_URL: postgresql://placeholder:placeholder@localhost:5432/placeholder
          HOSPITAL_DATABASE_URL: postgresql://placeholder:placeholder@localhost:5432/placeholder
        run: pnpm build
