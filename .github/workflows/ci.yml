name: Source checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.22.3'
      - uses: pnpm/action-setup@v4
        with:
          version: 10.18.0
      - run: pnpm install --frozen-lockfile
      - run: node scripts/qa/config-audit.mjs
      - run: pnpm test
      - run: pnpm test:protocol
      - run: pnpm check:syntax
      - run: pnpm docs:check
      - name: Generate Prisma clients and build
        env:
          NEXT_PUBLIC_OIDC_URL: http://localhost:8080
          NEXT_PUBLIC_OIDC_REALM: lankahealthchain
          NEXT_PUBLIC_OIDC_CLIENT_ID: lhc-web
          NEXT_PUBLIC_API_URL: http://localhost:3000/api/v1
          NEXT_PUBLIC_DEMO_PATIENT_ID: b1111111-1111-4111-8111-111111111111
        run: |
          pnpm build
          pnpm typecheck
