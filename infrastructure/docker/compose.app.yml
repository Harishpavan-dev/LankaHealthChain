# Combine with compose.yml; LOCAL DEV ONLY (Keycloak start-dev, Vite dev servers).
# Example:
# docker compose --env-file .env -f infrastructure/docker/compose.yml -f infrastructure/docker/compose.app.yml up -d --build
x-dev-image: &dev-image
  image: lhc-dev:local
  build:
    context: ../..
    dockerfile: infrastructure/docker/Dockerfile.dev
  restart: on-failure

services:
  migrate-and-seed:
    <<: *dev-image
    restart: 'no'
    command: ["sh","-ec","pnpm db:migrate && pnpm db:seed"]
    environment:
      DATABASE_URL: postgresql://lhc_core:${LHC_CORE_DB_PASSWORD:?Set core DB password}@postgres:5432/lankahealthchain_core
      HOSPITAL_NORTHERN_DATABASE_URL: postgresql://lhc_northern:${LHC_NORTHERN_DB_PASSWORD:?Set north DB password}@postgres:5432/hospital_northern
      HOSPITAL_JAFFNA_DATABASE_URL: postgresql://lhc_jaffna:${LHC_JAFFNA_DB_PASSWORD:?Set jaffna DB password}@postgres:5432/hospital_jaffna
      HOSPITAL_VENUS_DATABASE_URL: postgresql://lhc_venus:${LHC_VENUS_DB_PASSWORD:?Set venus DB password}@postgres:5432/hospital_venus
      HOSPITAL_NORTHERN_URL: ${HOSPITAL_NORTHERN_INTERNAL_URL:?Set internal URL}
      HOSPITAL_JAFFNA_URL: ${HOSPITAL_JAFFNA_INTERNAL_URL:?Set internal URL}
      HOSPITAL_VENUS_URL: ${HOSPITAL_VENUS_INTERNAL_URL:?Set internal URL}
    depends_on:
      postgres:
        condition: service_healthy

  api:
    <<: *dev-image
    command: ["pnpm","--filter","@lhc/api","dev"]
    environment:
      HOST: 0.0.0.0
      PORT: ${PORT:?Set Core API port}
      CORS_ORIGINS: ${CORS_ORIGINS:?Set CORS allowlist}
      DATABASE_URL: postgresql://lhc_core:${LHC_CORE_DB_PASSWORD:?Set core DB password}@postgres:5432/lankahealthchain_core
      HOSPITAL_NORTHERN_URL: ${HOSPITAL_NORTHERN_INTERNAL_URL:?Set internal URL}
      HOSPITAL_JAFFNA_URL: ${HOSPITAL_JAFFNA_INTERNAL_URL:?Set internal URL}
      HOSPITAL_VENUS_URL: ${HOSPITAL_VENUS_INTERNAL_URL:?Set internal URL}
      OIDC_JWKS_URL: ${OIDC_JWKS_INTERNAL_URL:?Set internal JWKS URL}
      OIDC_ISSUER: ${OIDC_ISSUER:?Set OIDC issuer}
      CONSENT_MODE: ${CONSENT_MODE:?Set explicit consent mode}
      RESEARCH_MODE: ${RESEARCH_MODE:?Set explicit research mode}
      NODE_ENV: ${NODE_ENV:?Set NODE_ENV}
      OIDC_AUDIENCE: ${OIDC_AUDIENCE:-lhc-api}
      BLOCKFROST_PREPROD_PROJECT_ID: ${BLOCKFROST_PREPROD_PROJECT_ID:-}
      CARDANO_METADATA_API_BASE_URL: ${CARDANO_METADATA_API_BASE_URL:?Set provider metadata API URL}
      WORKER_POLL_MS: ${WORKER_POLL_MS:-15000}
      HOSPITAL_NORTHERN_TOKEN_SECRET: ${HOSPITAL_NORTHERN_TOKEN_SECRET:?Secret required}
      HOSPITAL_JAFFNA_TOKEN_SECRET: ${HOSPITAL_JAFFNA_TOKEN_SECRET:?Secret required}
      HOSPITAL_VENUS_TOKEN_SECRET: ${HOSPITAL_VENUS_TOKEN_SECRET:?Secret required}
    ports:
      - '127.0.0.1:${PORT:?Set Core API port}:${PORT:?Set Core API port}'
    depends_on:
      migrate-and-seed:
        condition: service_completed_successfully

  hospital-northern:
    <<: *dev-image
    command: ["pnpm","--filter","@lhc/hospital-simulator","dev"]
    environment:
      HOST: 0.0.0.0
      PORT: ${HOSPITAL_NORTHERN_PORT:?Set hospital port}
      HOSPITAL_CODE: northern
      HOSPITAL_DATABASE_URL: postgresql://lhc_northern:${LHC_NORTHERN_DB_PASSWORD:?Set north DB password}@postgres:5432/hospital_northern
      HOSPITAL_TOKEN_SECRET: ${HOSPITAL_NORTHERN_TOKEN_SECRET:?Secret required}
    depends_on:
      migrate-and-seed:
        condition: service_completed_successfully

  hospital-jaffna:
    <<: *dev-image
    command: ["pnpm","--filter","@lhc/hospital-simulator","dev"]
    environment:
      HOST: 0.0.0.0
      PORT: ${HOSPITAL_JAFFNA_PORT:?Set hospital port}
      HOSPITAL_CODE: jaffna
      HOSPITAL_DATABASE_URL: postgresql://lhc_jaffna:${LHC_JAFFNA_DB_PASSWORD:?Set jaffna DB password}@postgres:5432/hospital_jaffna
      HOSPITAL_TOKEN_SECRET: ${HOSPITAL_JAFFNA_TOKEN_SECRET:?Secret required}
    depends_on:
      migrate-and-seed:
        condition: service_completed_successfully

  hospital-venus:
    <<: *dev-image
    command: ["pnpm","--filter","@lhc/hospital-simulator","dev"]
    environment:
      HOST: 0.0.0.0
      PORT: ${HOSPITAL_VENUS_PORT:?Set hospital port}
      HOSPITAL_CODE: venus
      HOSPITAL_DATABASE_URL: postgresql://lhc_venus:${LHC_VENUS_DB_PASSWORD:?Set venus DB password}@postgres:5432/hospital_venus
      HOSPITAL_TOKEN_SECRET: ${HOSPITAL_VENUS_TOKEN_SECRET:?Secret required}
    depends_on:
      migrate-and-seed:
        condition: service_completed_successfully

  # Runs outbox preparation asynchronously; no blockchain signing keys or API
  # credentials. Advisory DB locks serialize multiple replicas.
  anchor-worker:
    <<: *dev-image
    restart: unless-stopped
    stop_grace_period: 130s
    command: ["pnpm", "--filter", "@lhc/worker", "start"]
    environment:
      DATABASE_URL: postgresql://lhc_core:${LHC_CORE_DB_PASSWORD:?Set core DB password}@postgres:5432/lankahealthchain_core
      WORKER_POLL_MS: ${WORKER_POLL_MS:-15000}
      CARDANO_BATCH_DIR: /workspace/private/cardano-batches
    volumes:
      - ../../private/cardano-batches:/workspace/private/cardano-batches
    depends_on:
      migrate-and-seed:
        condition: service_completed_successfully

  patient-portal:
    <<: *dev-image
    command: ["pnpm","--filter","@lhc/patient-portal","exec","vite","--host","0.0.0.0","--port","${PATIENT_PORT:?Set portal port}"]
    environment:
      VITE_OIDC_URL: ${VITE_OIDC_URL:?Set public OIDC URL}
      VITE_OIDC_REALM: ${VITE_OIDC_REALM:?Set realm}
      VITE_OIDC_CLIENT_ID: ${VITE_OIDC_CLIENT_ID:?Set OIDC public client ID}
      VITE_API_URL: ${VITE_API_URL:?Set public API URL}
    ports: ['127.0.0.1:${PATIENT_PORT:?Set portal port}:${PATIENT_PORT:?Set portal port}']
    depends_on: [api]

  doctor-portal:
    <<: *dev-image
    command: ["pnpm","--filter","@lhc/doctor-portal","exec","vite","--host","0.0.0.0","--port","${DOCTOR_PORT:?Set portal port}"]
    environment:
      VITE_OIDC_URL: ${VITE_OIDC_URL:?Set public OIDC URL}
      VITE_OIDC_REALM: ${VITE_OIDC_REALM:?Set realm}
      VITE_OIDC_CLIENT_ID: ${VITE_OIDC_CLIENT_ID:?Set OIDC public client ID}
      VITE_API_URL: ${VITE_API_URL:?Set public API URL}
    ports: ['127.0.0.1:${DOCTOR_PORT:?Set portal port}:${DOCTOR_PORT:?Set portal port}']
    depends_on: [api]

  admin-portal:
    <<: *dev-image
    command: ["pnpm","--filter","@lhc/admin-portal","exec","vite","--host","0.0.0.0","--port","${ADMIN_PORT:?Set portal port}"]
    environment:
      VITE_OIDC_URL: ${VITE_OIDC_URL:?Set public OIDC URL}
      VITE_OIDC_REALM: ${VITE_OIDC_REALM:?Set realm}
      VITE_OIDC_CLIENT_ID: ${VITE_OIDC_CLIENT_ID:?Set OIDC public client ID}
      VITE_API_URL: ${VITE_API_URL:?Set public API URL}
    ports: ['127.0.0.1:${ADMIN_PORT:?Set portal port}:${ADMIN_PORT:?Set portal port}']
    depends_on: [api]

  cardano-preparer:
    <<: *dev-image
    profiles: ['operator']
    restart: 'no'
    command: ["pnpm","anchors:prepare"]
    environment:
      DATABASE_URL: postgresql://lhc_core:${LHC_CORE_DB_PASSWORD:?Set core DB password}@postgres:5432/lankahealthchain_core
      CARDANO_BATCH_DIR: /workspace/private/cardano-batches
    volumes:
      - ../../private/cardano-batches:/workspace/private/cardano-batches
    depends_on:
      migrate-and-seed:
        condition: service_completed_successfully


  hospital-admin-portal:
    <<: *dev-image
    command: ["pnpm","--filter","@lhc/hospital-admin-portal","exec","vite","--host","0.0.0.0","--port","${HOSPITAL_ADMIN_PORT:?Set portal port}"]
    environment:
      VITE_OIDC_URL: ${VITE_OIDC_URL:?Set public OIDC URL}
      VITE_OIDC_REALM: ${VITE_OIDC_REALM:?Set realm}
      VITE_OIDC_CLIENT_ID: ${VITE_OIDC_CLIENT_ID:?Set OIDC public client ID}
      VITE_API_URL: ${VITE_API_URL:?Set public API URL}
    ports: ['127.0.0.1:${HOSPITAL_ADMIN_PORT:?Set portal port}:${HOSPITAL_ADMIN_PORT:?Set portal port}']
    depends_on: [api]

  security-auditor-portal:
    <<: *dev-image
    command: ["pnpm","--filter","@lhc/security-auditor-portal","exec","vite","--host","0.0.0.0","--port","${AUDITOR_PORT:?Set portal port}"]
    environment:
      VITE_OIDC_URL: ${VITE_OIDC_URL:?Set public OIDC URL}
      VITE_OIDC_REALM: ${VITE_OIDC_REALM:?Set realm}
      VITE_OIDC_CLIENT_ID: ${VITE_OIDC_CLIENT_ID:?Set OIDC public client ID}
      VITE_API_URL: ${VITE_API_URL:?Set public API URL}
    ports: ['127.0.0.1:${AUDITOR_PORT:?Set portal port}:${AUDITOR_PORT:?Set portal port}']
    depends_on: [api]

  researcher-portal:
    <<: *dev-image
    command: ["pnpm","--filter","@lhc/researcher-portal","exec","vite","--host","0.0.0.0","--port","${RESEARCHER_PORT:?Set portal port}"]
    environment:
      VITE_OIDC_URL: ${VITE_OIDC_URL:?Set public OIDC URL}
      VITE_OIDC_REALM: ${VITE_OIDC_REALM:?Set realm}
      VITE_OIDC_CLIENT_ID: ${VITE_OIDC_CLIENT_ID:?Set OIDC public client ID}
      VITE_API_URL: ${VITE_API_URL:?Set public API URL}
    ports: ['127.0.0.1:${RESEARCHER_PORT:?Set portal port}:${RESEARCHER_PORT:?Set portal port}']
    depends_on: [api]
